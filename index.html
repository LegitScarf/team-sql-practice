<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High-Performance SQL Sandbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Auto-enables SharedArrayBuffer for multi-threading on any static host -->
  <script src="https://cdn.jsdelivr.net/npm/coi-serviceworker/coi-serviceworker.min.js"></script>
  
  <script type="module">
    import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

    let db = null;
    let conn = null;
    let currentResults = null;
    let currentPage = 1;
    const PAGE_SIZE = 50; // Render at most 50 rows at a time for 60fps scrolling

    async function init() {
      const status = document.getElementById('engine-status');
      status.innerText = "Spawning DuckDB Wasm Engine...";

      const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
      // Select best bundle (SIMD + Pthreads if available)
      const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
      const worker = await duckdb.createWorker(bundle.mainWorker);
      const logger = new duckdb.VoidLogger(); // Disable logging to console for max speed

      db = new duckdb.AsyncDuckDB(logger, worker);
      await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
      conn = await db.connect();

      status.innerHTML = `<span class="text-emerald-400">● Engine Active (${bundle.pthreadWorker ? 'Multi-threaded SIMD' : 'Standard'})</span>`;
      await refreshSchema();
    }

    async function refreshSchema() {
      const schemaList = document.getElementById('schema-list');
      schemaList.innerHTML = '';
      const tables = await conn.query(`SHOW TABLES;`);
      
      for (const row of tables.toArray()) {
        const tbl = row.name;
        const cols = await conn.query(`DESCRIBE ${tbl};`);
        const colList = cols.toArray();

        const card = document.createElement('div');
        card.className = "p-2 bg-slate-800 rounded border border-slate-700 text-xs";
        card.innerHTML = `
          <div class="font-bold text-amber-400 cursor-pointer hover:underline" onclick="window.insertText('${tbl}')">📊 ${tbl}</div>
          <div class="text-slate-400 text-[11px] mt-1 space-y-0.5">
            ${colList.map(c => `<div class="flex justify-between font-mono"><span>${c.column_name}</span><span class="text-slate-500">${c.column_type}</span></div>`).join('')}
          </div>
        `;
        schemaList.appendChild(card);
      }
    }

    window.insertText = (t) => {
      const ed = document.getElementById('sql-editor');
      ed.value += ` ${t}`;
      ed.focus();
    };

    // FAST FILE REGISTRATION (Zero-Copy View)
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const tblName = file.name.replace(/\.[^/.]+$/, "").replace(/[^a-zA-Z0-9_]/g, "_").toLowerCase();
      const status = document.getElementById('upload-status');
      const start = performance.now();
      status.innerText = `Registering ${file.name}...`;

      try {
        // Register raw file handle without in-memory copy
        await db.registerFileHandle(file.name, file, duckdb.DuckDBDataProtocol.BROWSER_FILEREADER, true);

        // CREATE VIEW instead of TABLE (Zero duplicate memory overhead)
        if (file.name.endsWith('.csv')) {
          await conn.query(`CREATE OR REPLACE VIEW ${tblName} AS SELECT * FROM read_csv_auto('${file.name}', parallel=true);`);
        } else if (file.name.endsWith('.parquet')) {
          await conn.query(`CREATE OR REPLACE VIEW ${tblName} AS SELECT * FROM read_parquet('${file.name}');`);
        } else if (file.name.endsWith('.json')) {
          await conn.query(`CREATE OR REPLACE VIEW ${tblName} AS SELECT * FROM read_json_auto('${file.name}');`);
        }

        const elapsed = (performance.now() - start).toFixed(0);
        status.innerHTML = `<span class="text-emerald-400">✓ View <b>${tblName}</b> ready in ${elapsed}ms</span>`;
        await refreshSchema();
      } catch (err) {
        status.innerHTML = `<span class="text-rose-400">Error: ${err.message}</span>`;
      }
    });

    // HIGH SPEED EXECUTION & VIRTUAL PAGINATION
    window.runQuery = async () => {
      const sql = document.getElementById('sql-editor').value.trim();
      const resultsArea = document.getElementById('results-area');
      const errorBox = document.getElementById('error-box');
      const meta = document.getElementById('query-meta');
      const pagination = document.getElementById('pagination-bar');

      errorBox.classList.add('hidden');
      if (!sql) return;

      const t0 = performance.now();
      meta.innerText = "Executing...";

      try {
        // Query returns Apache Arrow Table (columnar vectors)
        currentResults = await conn.query(sql);
        const t1 = performance.now();
        const duration = (t1 - t0).toFixed(1);
        
        const totalRows = currentResults.numRows;
        meta.innerHTML = `<span class="text-emerald-400">${totalRows.toLocaleString()} rows</span> in <span class="text-amber-300">${duration} ms</span>`;

        if (totalRows === 0) {
          resultsArea.innerHTML = `<div class="text-slate-500 p-4">Query returned 0 rows.</div>`;
          pagination.classList.add('hidden');
          return;
        }

        currentPage = 1;
        renderPage();
        pagination.classList.remove('hidden');
      } catch (err) {
        meta.innerText = '';
        resultsArea.innerHTML = '';
        pagination.classList.add('hidden');
        errorBox.classList.remove('hidden');
        errorBox.innerHTML = `<strong>Execution Error:</strong><br>${err.message}`;
      }
    };

    function renderPage() {
      const resultsArea = document.getElementById('results-area');
      const pageInfo = document.getElementById('page-info');
      const totalRows = currentResults.numRows;
      const totalPages = Math.ceil(totalRows / PAGE_SIZE) || 1;

      pageInfo.innerText = `Page ${currentPage} of ${totalPages.toLocaleString()}`;

      const startIdx = (currentPage - 1) * PAGE_SIZE;
      const endIdx = Math.min(startIdx + PAGE_SIZE, totalRows);
      
      const fields = currentResults.schema.fields.map(f => f.name);

      // Fast columnar chunk read
      let tableHtml = `
        <div class="overflow-x-auto">
          <table class="min-w-full text-left text-xs font-mono divide-y divide-slate-800">
            <thead class="bg-slate-900 sticky top-0 text-slate-300">
              <tr>
                <th class="px-3 py-2 text-slate-600">#</th>
                ${fields.map(f => `<th class="px-3 py-2 font-semibold border-b border-slate-700">${f}</th>`).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-900 bg-slate-950 text-slate-300">
      `;

      // Read values slice-by-slice directly from Arrow vectors
      for (let r = startIdx; r < endIdx; r++) {
        tableHtml += `<tr class="hover:bg-slate-900">`;
        tableHtml += `<td class="px-3 py-1 text-slate-600 select-none">${r + 1}</td>`;
        for (const col of currentResults.schema.fields) {
          const val = currentResults.getChild(col.name).get(r);
          tableHtml += `<td class="px-3 py-1 whitespace-nowrap">${val === null ? '<span class="text-slate-600">NULL</span>' : val}</td>`;
        }
        tableHtml += `</tr>`;
      }

      tableHtml += `</tbody></table></div>`;
      resultsArea.innerHTML = tableHtml;
    }

    window.nextPage = () => {
      const totalPages = Math.ceil(currentResults.numRows / PAGE_SIZE);
      if (currentPage < totalPages) {
        currentPage++;
        renderPage();
      }
    };

    window.prevPage = () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    };

    // Keyboard shortcut (Ctrl + Enter)
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        window.runQuery();
      }
    });

    init();
  </script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans">
  
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-2.5 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="bg-indigo-600 px-2 py-0.5 rounded text-white font-black text-sm">SQL Turbo</span>
      <h1 class="text-sm font-semibold">High-Speed Dataset Compiler</h1>
    </div>
    <div id="engine-status" class="text-xs text-amber-400 font-mono">Initializing...</div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900/60 border-r border-slate-800 p-3 flex flex-col justify-between">
      <div class="overflow-y-auto">
        <h2 class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">Tables / Views</h2>
        <div id="schema-list" class="space-y-2"></div>
      </div>
      <div class="border-t border-slate-800 pt-3">
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Load Large File</label>
        <input type="file" id="file-input" accept=".csv,.parquet,.json" class="block w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-indigo-600 file:text-white cursor-pointer"/>
        <div id="upload-status" class="text-[11px] text-slate-500 mt-1">Direct memory streaming</div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- Editor -->
      <div class="p-3 border-b border-slate-800 flex flex-col">
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-xs font-semibold text-slate-400 uppercase">SQL Query <span class="text-slate-600">(Ctrl + Enter)</span></span>
          <button onclick="runQuery()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-3.5 py-1.5 rounded transition">
            ▶ Execute
          </button>
        </div>
        <textarea id="sql-editor" rows="5" class="w-full bg-slate-900 border border-slate-800 rounded p-2.5 font-mono text-xs text-emerald-300 focus:outline-none focus:border-indigo-500" placeholder="SELECT * FROM table_name LIMIT 100;"></textarea>
      </div>

      <!-- Error banner -->
      <div id="error-box" class="hidden m-3 p-2.5 bg-rose-950/80 border border-rose-800 rounded text-rose-300 font-mono text-xs overflow-auto"></div>

      <!-- Results view -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <div class="bg-slate-900/40 px-4 py-1.5 border-b border-slate-800 flex justify-between items-center text-xs">
          <div id="query-meta" class="font-mono text-slate-400">Results will appear here</div>
          <!-- Pagination controls -->
          <div id="pagination-bar" class="hidden flex items-center space-x-2">
            <button onclick="prevPage()" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 text-xs">◀ Prev</button>
            <span id="page-info" class="text-slate-400 font-mono text-[11px]"></span>
            <button onclick="nextPage()" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 text-xs">Next ▶</button>
          </div>
        </div>
        <div id="results-area" class="flex-1 overflow-auto"></div>
      </div>
    </main>
  </div>
</body>
</html>
