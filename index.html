<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Practice Lab</title>
  <!-- Tailwind CSS CDN for modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- DuckDB-Wasm -->
  <script type="module">
    import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

    let db = null;
    let conn = null;

    async function initDB() {
      const statusEl = document.getElementById('engine-status');
      statusEl.innerText = "Initializing SQL Engine (Wasm)...";
      
      const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
      const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
      const worker = await duckdb.createWorker(bundle.mainWorker);
      const logger = new duckdb.ConsoleLogger();
      
      db = new duckdb.AsyncDuckDB(logger, worker);
      await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
      conn = await db.connect();
      
      statusEl.innerHTML = '<span class="text-emerald-400">● Engine Ready (DuckDB Postgre-Dialect)</span>';
      
      // Load sample practice datasets
      await loadSampleData();
      await refreshSchema();
    }

    async function loadSampleData() {
      await conn.query(`
        CREATE TABLE employees (id INT, name VARCHAR, department VARCHAR, salary INT, hire_date DATE);
        INSERT INTO employees VALUES 
          (1, 'Alice Johnson', 'Engineering', 95000, '2021-03-15'),
          (2, 'Bob Smith', 'Engineering', 80000, '2022-06-01'),
          (3, 'Charlie Brown', 'Marketing', 65000, '2020-01-10'),
          (4, 'Diana Prince', 'Finance', 110000, '2019-11-20'),
          (5, 'Evan Wright', 'Engineering', 105000, '2018-08-05'),
          (6, 'Fiona Gallagher', 'Marketing', 72000, '2023-02-18');

        CREATE TABLE departments (dept_name VARCHAR, budget INT, manager_id INT);
        INSERT INTO departments VALUES
          ('Engineering', 500000, 5),
          ('Marketing', 200000, 3),
          ('Finance', 350000, 4);
      `);
    }

    async function refreshSchema() {
      const schemaList = document.getElementById('schema-list');
      schemaList.innerHTML = '';
      const tables = await conn.query(`SHOW TABLES;`);
      const tableRows = tables.toArray();

      for (const row of tableRows) {
        const tableName = row.name;
        const cols = await conn.query(`DESCRIBE ${tableName};`);
        const colRows = cols.toArray();

        const tableCard = document.createElement('div');
        tableCard.className = "mb-3 bg-slate-800 p-2.5 rounded border border-slate-700";
        tableCard.innerHTML = `
          <div class="font-bold text-amber-400 text-sm flex justify-between items-center cursor-pointer hover:underline" onclick="insertTableName('${tableName}')">
            <span>📋 ${tableName}</span>
            <span class="text-xs text-slate-400">${colRows.length} cols</span>
          </div>
          <ul class="text-xs text-slate-300 mt-1.5 space-y-0.5 font-mono">
            ${colRows.map(c => `<li class="flex justify-between text-slate-400"><span>${c.column_name}</span><span class="text-slate-500">${c.column_type}</span></li>`).join('')}
          </ul>
        `;
        schemaList.appendChild(tableCard);
      }
    }

    window.insertTableName = (tbl) => {
      const editor = document.getElementById('sql-editor');
      editor.value += ` ${tbl}`;
      editor.focus();
    };

    window.runQuery = async () => {
      const query = document.getElementById('sql-editor').value.trim();
      const outputDiv = document.getElementById('results-area');
      const errorDiv = document.getElementById('error-box');
      const timeElapsed = document.getElementById('exec-time');

      errorDiv.classList.add('hidden');
      errorDiv.innerText = '';
      outputDiv.innerHTML = '<div class="text-slate-400 p-4">Executing query...</div>';

      if (!query) {
        outputDiv.innerHTML = '<div class="text-slate-400 p-4">Query is empty. Type a SQL statement above.</div>';
        return;
      }

      const start = performance.now();
      try {
        const result = await conn.query(query);
        const duration = (performance.now() - start).toFixed(1);
        timeElapsed.innerText = `${duration} ms (${result.numRows} rows)`;

        const rows = result.toArray();
        if (rows.length === 0) {
          outputDiv.innerHTML = `<div class="text-emerald-400 p-4">✓ Query executed successfully. (0 rows returned)</div>`;
          return;
        }

        const fields = result.schema.fields.map(f => f.name);
        let tableHTML = `
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-700 text-left text-sm font-mono">
              <thead class="bg-slate-800 text-slate-200">
                <tr>${fields.map(f => `<th class="px-3 py-2 border-b border-slate-700 font-semibold">${f}</th>`).join('')}</tr>
              </thead>
              <tbody class="divide-y divide-slate-800 bg-slate-900/60 text-slate-300">
        `;

        for (const row of rows) {
          tableHTML += `<tr class="hover:bg-slate-800/50">`;
          for (const field of fields) {
            let val = row[field];
            if (val === null || val === undefined) val = '<span class="text-slate-500 italic">NULL</span>';
            tableHTML += `<td class="px-3 py-1.5 whitespace-nowrap">${val}</td>`;
          }
          tableHTML += `</tr>`;
        }

        tableHTML += `</tbody></table></div>`;
        outputDiv.innerHTML = tableHTML;
      } catch (err) {
        timeElapsed.innerText = '';
        outputDiv.innerHTML = '';
        errorDiv.classList.remove('hidden');
        errorDiv.innerHTML = `<strong>SQL Error:</strong><br>${err.message}`;
      }
    };

    // File Upload Handler (CSV / Parquet / JSON)
    document.getElementById('csv-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const cleanTableName = file.name.replace(/\.[^/.]+$/, "").replace(/[^a-zA-Z0-9_]/g, "_").toLowerCase();
      const statusEl = document.getElementById('upload-status');
      statusEl.innerText = `Uploading and parsing ${file.name}...`;

      try {
        await db.registerFileHandle(file.name, file, duckdb.DuckDBDataProtocol.BROWSER_FILEREADER, true);
        
        if (file.name.endsWith('.csv')) {
          await conn.query(`CREATE OR REPLACE TABLE ${cleanTableName} AS SELECT * FROM read_csv_auto('${file.name}');`);
        } else if (file.name.endsWith('.json')) {
          await conn.query(`CREATE OR REPLACE TABLE ${cleanTableName} AS SELECT * FROM read_json_auto('${file.name}');`);
        } else if (file.name.endsWith('.parquet')) {
          await conn.query(`CREATE OR REPLACE TABLE ${cleanTableName} AS SELECT * FROM read_parquet('${file.name}');`);
        }

        statusEl.innerHTML = `<span class="text-emerald-400">✓ Loaded as table <b>${cleanTableName}</b></span>`;
        await refreshSchema();
      } catch (err) {
        statusEl.innerHTML = `<span class="text-rose-400">Failed: ${err.message}</span>`;
      }
    });

    // Keyboard shortcut: Ctrl + Enter to run
    document.getElementById('sql-editor').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        window.runQuery();
      }
    });

    initDB();
  </script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 p-1.5 rounded text-white font-black text-lg">SQL</div>
      <h1 class="text-lg font-bold">SQL Practice & Sandbox</h1>
      <span class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-400">In-Browser Engine</span>
    </div>
    <div id="engine-status" class="text-xs text-amber-400 font-mono">Loading Engine...</div>
  </header>

  <!-- Main Body -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Sidebar: Schema & Upload -->
    <aside class="w-72 bg-slate-900/70 border-r border-slate-800 p-4 flex flex-col justify-between overflow-y-auto">
      <div>
        <h2 class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-3">Available Tables</h2>
        <div id="schema-list" class="space-y-2">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Dataset Upload Box -->
      <div class="mt-4 border-t border-slate-800 pt-4">
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Upload Dataset</label>
        <input type="file" id="csv-file" accept=".csv,.json,.parquet" class="block w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer mb-2"/>
        <div id="upload-status" class="text-xs text-slate-400 mt-1">Accepts CSV, JSON, or Parquet</div>
      </div>
    </aside>

    <!-- Content: Editor & Result -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-950">
      
      <!-- SQL Input -->
      <div class="p-4 border-b border-slate-800 flex flex-col">
        <div class="flex justify-between items-center mb-2">
          <label for="sql-editor" class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Query Editor <span class="text-slate-500">(Ctrl + Enter to run)</span></label>
          <button onclick="runQuery()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-1.5 rounded transition shadow">
            ▶ Run Query
          </button>
        </div>
        <textarea id="sql-editor" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded p-3 font-mono text-sm text-emerald-300 focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="SELECT * FROM employees WHERE salary > 75000 ORDER BY salary DESC;">SELECT e.name, e.department, e.salary, d.budget 
FROM employees e
JOIN departments d ON e.department = d.dept_name
ORDER BY e.salary DESC;</textarea>
      </div>

      <!-- Error Box -->
      <div id="error-box" class="hidden m-4 p-3 bg-rose-950/80 border border-rose-700 rounded text-rose-300 font-mono text-xs overflow-auto"></div>

      <!-- Results Area -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <div class="bg-slate-900/40 px-4 py-2 border-b border-slate-800 flex justify-between items-center text-xs text-slate-400">
          <span class="font-semibold uppercase tracking-wide">Query Results</span>
          <span id="exec-time" class="font-mono text-slate-400"></span>
        </div>
        <div id="results-area" class="flex-1 overflow-auto p-4">
          <div class="text-slate-500 text-sm italic">Click "Run Query" or press Ctrl+Enter to view results.</div>
        </div>
      </div>

    </main>
  </div>
</body>
</html>
