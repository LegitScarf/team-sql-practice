<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Practice Lab & Compiler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Enables SharedArrayBuffer for multi-threaded SIMD on any static host -->
  <script src="https://cdn.jsdelivr.net/npm/coi-serviceworker/coi-serviceworker.min.js"></script>

  <script type="module">
    import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

    let db = null;
    let conn = null;
    let currentResults = null;
    let currentPage = 1;
    const PAGE_SIZE = 50; // Max rows rendered to the DOM per page for instant performance

    // --- INITIALIZE DUCKDB-WASM ENGINE ---
    async function init() {
      const status = document.getElementById('engine-status');
      status.innerText = "Spawning DuckDB Wasm Engine...";

      try {
        const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
        const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
        const worker = await duckdb.createWorker(bundle.mainWorker);
        const logger = new duckdb.VoidLogger();

        db = new duckdb.AsyncDuckDB(logger, worker);
        await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
        conn = await db.connect();

        status.innerHTML = `<span class="text-emerald-400">● Engine Ready (${bundle.pthreadWorker ? 'Multi-threaded SIMD' : 'Standard'})</span>`;
        
        await loadSampleData();
        await refreshSchema();
      } catch (err) {
        status.innerHTML = `<span class="text-rose-400">Engine Init Failed: ${err.message}</span>`;
      }
    }

    // Default starter dataset
    async function loadSampleData() {
      await conn.query(`
        CREATE TABLE IF NOT EXISTS "employees" (
          "Employee ID" INT, 
          "First Name" VARCHAR, 
          "Last Name" VARCHAR, 
          "Department" VARCHAR, 
          "Annual Salary" INT
        );
        INSERT INTO "employees" VALUES 
          (101, 'Alice', 'Johnson', 'Engineering', 95000),
          (102, 'Bob', 'Smith', 'Engineering', 80000),
          (103, 'Charlie', 'Brown', 'Marketing', 65000),
          (104, 'Diana', 'Prince', 'Finance', 110000),
          (105, 'Evan', 'Wright', 'Engineering', 105000),
          (106, 'Fiona', 'Gallagher', 'Marketing', 72000);
      `);
    }

    // Refresh Sidebar Tables and Column Lists
    async function refreshSchema() {
      const schemaList = document.getElementById('schema-list');
      schemaList.innerHTML = '';
      const tables = await conn.query(`SHOW TABLES;`);
      
      for (const row of tables.toArray()) {
        const tbl = row.name;
        const cols = await conn.query(`DESCRIBE "${tbl}";`);
        const colList = cols.toArray();

        const card = document.createElement('div');
        card.className = "p-2 bg-slate-800/80 rounded border border-slate-700 text-xs";
        
        // Escape table name if it contains spaces
        const formattedTbl = tbl.includes(' ') ? `"${tbl}"` : tbl;

        card.innerHTML = `
          <div class="font-bold text-amber-400 cursor-pointer hover:underline flex justify-between items-center" 
               onclick="window.insertText('${formattedTbl}')" title="Click to insert table name">
            <span>📋 ${tbl}</span>
            <span class="text-[10px] text-slate-500">${colList.length} cols</span>
          </div>
          <div class="text-slate-400 text-[11px] mt-1 space-y-0.5">
            ${colList.map(c => {
              // Automatically wrap column names that have spaces in double quotes
              const colIdent = c.column_name.includes(' ') ? `"${c.column_name}"` : c.column_name;
              return `
                <div class="flex justify-between font-mono hover:text-slate-200 cursor-pointer py-0.5" 
                     onclick="window.insertText('${colIdent}')" title="Click to insert column">
                  <span>${c.column_name}</span>
                  <span class="text-slate-500">${c.column_type}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
        schemaList.appendChild(card);
      }
    }

    window.insertText = (t) => {
      const ed = document.getElementById('sql-editor');
      ed.focus();
      const start = ed.selectionStart;
      const end = ed.selectionEnd;
      const val = ed.value;
      ed.value = val.substring(0, start) + t + val.substring(end);
      ed.selectionStart = ed.selectionEnd = start + t.length;
    };

    // --- ZERO-COPY HIGH-SPEED FILE REGISTRATION ---
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const tblName = file.name.replace(/\.[^/.]+$/, "").replace(/[^a-zA-Z0-9_]/g, "_").toLowerCase();
      const status = document.getElementById('upload-status');
      const start = performance.now();
      status.innerText = `Streaming ${file.name}...`;

      try {
        await db.registerFileHandle(file.name, file, duckdb.DuckDBDataProtocol.BROWSER_FILEREADER, true);

        // CREATE VIEW allows zero-copy virtual querying without duplicating data in memory
        if (file.name.endsWith('.csv')) {
          await conn.query(`CREATE OR REPLACE VIEW "${tblName}" AS SELECT * FROM read_csv_auto('${file.name}', parallel=true);`);
        } else if (file.name.endsWith('.parquet')) {
          await conn.query(`CREATE OR REPLACE VIEW "${tblName}" AS SELECT * FROM read_parquet('${file.name}');`);
        } else if (file.name.endsWith('.json')) {
          await conn.query(`CREATE OR REPLACE VIEW "${tblName}" AS SELECT * FROM read_json_auto('${file.name}');`);
        }

        const elapsed = (performance.now() - start).toFixed(0);
        status.innerHTML = `<span class="text-emerald-400">✓ <b>${tblName}</b> ready in ${elapsed}ms</span>`;
        await refreshSchema();
      } catch (err) {
        status.innerHTML = `<span class="text-rose-400">Upload Error: ${err.message}</span>`;
      }
    });

    // --- QUERY EXECUTION & PAGINATION ---
    window.runQuery = async () => {
      const sql = document.getElementById('sql-editor').value.trim();
      const resultsArea = document.getElementById('results-area');
      const errorBox = document.getElementById('error-box');
      const meta = document.getElementById('query-meta');
      const pagination = document.getElementById('pagination-bar');

      errorBox.classList.add('hidden');
      if (!sql) return;

      const t0 = performance.now();
      meta.innerText = "Executing...";

      try {
        currentResults = await conn.query(sql);
        const duration = (performance.now() - t0).toFixed(1);
        const totalRows = currentResults.numRows;

        meta.innerHTML = `<span class="text-emerald-400">${totalRows.toLocaleString()} rows</span> in <span class="text-amber-300">${duration} ms</span>`;

        if (totalRows === 0) {
          resultsArea.innerHTML = `<div class="text-slate-500 p-4">Query executed successfully (0 rows returned).</div>`;
          pagination.classList.add('hidden');
          return;
        }

        currentPage = 1;
        renderPage();
        pagination.classList.remove('hidden');
      } catch (err) {
        meta.innerText = '';
        resultsArea.innerHTML = '';
        pagination.classList.add('hidden');
        errorBox.classList.remove('hidden');

        // Check for common space in column name issue and offer a helpful tip
        let hint = '';
        if (err.message.includes('not found') || err.message.includes('syntax error')) {
          hint = `<div class="mt-2 text-amber-300 font-sans text-xs bg-amber-950/40 p-2 rounded border border-amber-800">
            💡 <b>Helpful Tip:</b> Does your query use column names with spaces (e.g. <code>First Name</code>)? <br>
            In SQL, wrap them in double quotes: <code>SELECT "First Name" FROM table;</code>
          </div>`;
        }

        errorBox.innerHTML = `<strong>SQL Error:</strong><br>${err.message}${hint}`;
      }
    };

    function renderPage() {
      const resultsArea = document.getElementById('results-area');
      const pageInfo = document.getElementById('page-info');
      const totalRows = currentResults.numRows;
      const totalPages = Math.ceil(totalRows / PAGE_SIZE) || 1;

      pageInfo.innerText = `Page ${currentPage} of ${totalPages.toLocaleString()}`;

      const startIdx = (currentPage - 1) * PAGE_SIZE;
      const endIdx = Math.min(startIdx + PAGE_SIZE, totalRows);
      const fields = currentResults.schema.fields.map(f => f.name);

      let tableHtml = `
        <div class="overflow-x-auto">
          <table class="min-w-full text-left text-xs font-mono divide-y divide-slate-800">
            <thead class="bg-slate-900 sticky top-0 text-slate-300 z-10">
              <tr>
                <th class="px-3 py-2 text-slate-600 bg-slate-900">#</th>
                ${fields.map(f => `<th class="px-3 py-2 font-semibold border-b border-slate-700 bg-slate-900">${f}</th>`).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-900 bg-slate-950 text-slate-300">
      `;

      // Read directly from Arrow columnar vectors slice-by-slice
      for (let r = startIdx; r < endIdx; r++) {
        tableHtml += `<tr class="hover:bg-slate-900">`;
        tableHtml += `<td class="px-3 py-1 text-slate-600 select-none">${r + 1}</td>`;
        for (const col of currentResults.schema.fields) {
          const val = currentResults.getChild(col.name).get(r);
          tableHtml += `<td class="px-3 py-1 whitespace-nowrap">${val === null ? '<span class="text-slate-600">NULL</span>' : val}</td>`;
        }
        tableHtml += `</tr>`;
      }

      tableHtml += `</tbody></table></div>`;
      resultsArea.innerHTML = tableHtml;
    }

    window.nextPage = () => {
      const totalPages = Math.ceil(currentResults.numRows / PAGE_SIZE);
      if (currentPage < totalPages) {
        currentPage++;
        renderPage();
      }
    };

    window.prevPage = () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    };

    // --- DYNAMIC SPLITTER RESIZE LOGIC ---
    const resizer = document.getElementById('drag-resizer');
    const editorContainer = document.getElementById('editor-container');
    let isDragging = false;

    resizer.addEventListener('mousedown', (e) => {
      isDragging = true;
      document.body.style.cursor = 'row-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = editorContainer.getBoundingClientRect();
      const newHeight = e.clientY - rect.top;

      if (newHeight >= 120 && newHeight <= window.innerHeight * 0.8) {
        editorContainer.style.height = `${newHeight}px`;
      }
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    window.setEditorHeight = (px) => {
      editorContainer.style.height = `${px}px`;
    };

    // Keyboard shortcut (Ctrl + Enter) to run
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        window.runQuery();
      }
    });

    init();
  </script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans select-none overflow-hidden">
  
  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-2.5 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="bg-indigo-600 px-2 py-0.5 rounded text-white font-black text-sm">SQL Turbo</span>
      <h1 class="text-sm font-semibold">In-Browser Practice Lab</h1>
    </div>
    <div id="engine-status" class="text-xs text-amber-400 font-mono">Initializing...</div>
  </header>

  <!-- Body -->
  <div class="flex flex-1 overflow-hidden select-text">
    
    <!-- Left Sidebar -->
    <aside class="w-64 bg-slate-900/60 border-r border-slate-800 p-3 flex flex-col justify-between select-none">
      <div class="overflow-y-auto pr-1">
        <h2 class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">Tables & Schema</h2>
        <div id="schema-list" class="space-y-2"></div>
      </div>
      
      <div class="border-t border-slate-800 pt-3">
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Load Dataset</label>
        <input type="file" id="file-input" accept=".csv,.parquet,.json" class="block w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-indigo-600 file:text-white cursor-pointer"/>
        <div id="upload-status" class="text-[11px] text-slate-500 mt-1">Accepts CSV, Parquet, JSON</div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-950">
      
      <!-- Resizable SQL Editor Container -->
      <div id="editor-container" class="flex flex-col bg-slate-950 p-3 min-h-[120px]" style="height: 220px;">
        <div class="flex justify-between items-center mb-1.5 select-none">
          <div class="flex items-center space-x-3">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">
              SQL Editor <span class="text-slate-600 font-normal">(Ctrl + Enter)</span>
            </span>
            <!-- Quick Preset Resize Buttons -->
            <div class="flex items-center space-x-1 text-[11px]">
              <button onclick="setEditorHeight(140)" class="px-2 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400">Compact</button>
              <button onclick="setEditorHeight(320)" class="px-2 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400">50/50</button>
              <button onclick="setEditorHeight(550)" class="px-2 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400">Large</button>
            </div>
          </div>
          <button onclick="runQuery()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-1.5 rounded transition shadow">
            ▶ Execute
          </button>
        </div>

        <textarea id="sql-editor" class="flex-1 w-full bg-slate-900 border border-slate-800 rounded p-2.5 font-mono text-xs text-emerald-300 focus:outline-none focus:border-indigo-500 resize-none leading-relaxed" placeholder="SELECT &quot;First Name&quot;, &quot;Annual Salary&quot; FROM employees WHERE &quot;Annual Salary&quot; > 70000;">SELECT "First Name", "Last Name", "Department", "Annual Salary"
FROM employees 
WHERE "Annual Salary" >= 75000 
ORDER BY "Annual Salary" DESC;</textarea>
      </div>

      <!-- Draggable Splitter Divider -->
      <div id="drag-resizer" class="h-2 bg-slate-900 hover:bg-indigo-600 cursor-row-resize flex items-center justify-center border-y border-slate-800 transition-colors select-none group" title="Click and drag to resize editor">
        <div class="w-8 h-1 rounded-full bg-slate-700 group-hover:bg-white transition-colors"></div>
      </div>

      <!-- Error Box -->
      <div id="error-box" class="hidden m-3 p-3 bg-rose-950/80 border border-rose-800 rounded text-rose-300 font-mono text-xs overflow-auto"></div>

      <!-- Results View -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <div class="bg-slate-900/40 px-4 py-1.5 border-b border-slate-800 flex justify-between items-center text-xs">
          <div id="query-meta" class="font-mono text-slate-400">Ready</div>
          <!-- Pagination -->
          <div id="pagination-bar" class="hidden flex items-center space-x-2">
            <button onclick="prevPage()" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 text-xs">◀ Prev</button>
            <span id="page-info" class="text-slate-400 font-mono text-[11px]"></span>
            <button onclick="nextPage()" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 text-xs">Next ▶</button>
          </div>
        </div>
        <div id="results-area" class="flex-1 overflow-auto"></div>
      </div>

    </main>
  </div>
</body>
</html>
